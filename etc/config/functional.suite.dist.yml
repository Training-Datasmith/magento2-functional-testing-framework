# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
namespace: Magento\Functional_Testing_Framework
modules:
    enabled:
        - \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver
        - \Magento\Functional_Testing_Framework\Module\Magento_Sequence
        - \Magento\Functional_Testing_Framework\Module\Magento_Assert
        - \Magento\Functional_Testing_Framework\Module\Magento_Action_Proxies
        - Asserts
        - \Magento\Functional_Testing_Framework\Helper\Helper_Container
    config:
        \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver:
            url: "%MAGENTO_BASE_URL%"
            backend_url: "%MAGENTO_BACKEND_BASE_URL%"
            backend_name: "%MAGENTO_BACKEND_NAME%"
            browser: 'chrome'
            restart: true
            window_size: 1920x1080
            username: "%MAGENTO_ADMIN_USERNAME%"
            password: "%MAGENTO_ADMIN_PASSWORD%"
            pageload_timeout: "%WAIT_TIMEOUT%"
            request_timeout: "%WAIT_TIMEOUT%"
            connection_timeout: "%WAIT_TIMEOUT%"
            host: "%SELENIUM_HOST%"
            port: "%SELENIUM_PORT%"
            protocol: "%SELENIUM_PROTOCOL%"
            path: "%SELENIUM_PATH%"
            close_all_sessions: "%SELENIUM_CLOSE_ALL_SESSIONS%"
            capabilities:
                unhandledPromptBehavior: "ignore"
                chromeOptions:
                    args: ["--no-sandbox", "--window-size=1920,1080", "--disable-extensions", "--enable-automation", "--disable-gpu", "--enable-Passthrough", "--disable-dev-shm-usage", "--disable-component-update", "--disable-features=OptimizationHints","--disable-background-networking","--disable-domain-reliability","--disable-breakpad","--disable-features=ThirdPartyCookieBlocking,SameSiteByDefaultCookies,StoragePartitioning,AutofocusPreventsAccidentalCrossOriginActivation,BlockInsecurePrivateNetworkRequests","--disable-web-security","--allow-running-insecure-content","--disable-site-isolation-trials","--disable-features=site-per-process"]
