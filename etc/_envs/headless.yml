# `headless` environment config goes here
modules:
    enabled:
        - \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver
        - \Magento\Functional_Testing_Framework\Helper\Acceptance
    config:
        \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver:
            browser: 'chrome'
            window_size: false
            capabilities:
                chromeOptions:
                    args: ["--headless", "--disable-gpu", "--disable-extensions"]
                    binary: "/Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome"