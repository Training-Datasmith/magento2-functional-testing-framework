# `chrome` environment config goes here
modules:
    enabled:
        - \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver
        - \Magento\Functional_Testing_Framework\Helper\Acceptance
    config:
        \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver:
            browser: 'chrome'
            capabilities:
                chromeOptions:
                    args: ["--start-maximized", "--disable-extensions", "--enable-automation"]