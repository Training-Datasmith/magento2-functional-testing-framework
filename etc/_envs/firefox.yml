# `firefox` environment config goes here
modules:
    enabled:
        - \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver
        - \Magento\Functional_Testing_Framework\Helper\Acceptance
    config:
        \Magento\Functional_Testing_Framework\Module\Magento_Web_Driver:
            browser: 'firefox'
            restart: true
            window_size: maximize